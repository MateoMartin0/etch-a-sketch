<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>etch a sketch</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="/js/main.js" defer></script>
</head>
<body>
    <header>
        <h1>ETCH A SKETCH</h1>
    </header>
    <div class="game-container">
        <section id="options">
            <button class="choice-btn">Color</button>
            <button class="choice-btn">Eraser</button>
            <button class="choice-btn">Clear</button>
            <div class="bar-container">
                <span class="size-display">8 x 8</span>
                <input  class="size-bar" type="range" min="8" step="8" max="64" value="8">
            </div>
        </section>
        <section id="draw-area"></section>
        <div class="void"></div>
    </div>
</body>
</html>
